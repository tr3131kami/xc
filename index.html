<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クリスマスカウントダウン</title>
<meta name="description" content="クリスマスまでの日数をカウントダウンするアプリ。あと何日・何時間・何分・何秒かがリアルタイムで分かります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf7;
    --card: #ffffff;
    --text: #4a4553;
    --text-muted: #a8a2b3;
    --red: #ff8fa3;
    --green: #7fd8a4;
    --gold: #ffcf6e;
    --accent: #ffb8d1;
    --accent2: #c4b5fd;
    --shadow: 0 8px 30px rgba(180, 170, 200, .14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: linear-gradient(180deg, #fff5f2 0%, var(--bg) 45%, #f3fbf5 100%);
    color: var(--text);
    overflow-x: hidden;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .wrap {
    position: relative; z-index: 2;
    max-width: 640px; margin: 0 auto;
    padding: 56px 20px 64px;
    text-align: center;
  }
  .deco { font-size: 3rem; line-height: 1; }
  h1 {
    margin-top: 10px;
    font-size: clamp(1.7rem, 6vw, 2.5rem);
    font-weight: 900;
    letter-spacing: .02em;
    background: linear-gradient(90deg, #ff8fa3, #e5b95f, #5fbf8f, #ff8fa3);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: grad 8s linear infinite;
  }
  @keyframes grad { to { background-position: 300% 0; } }
  .target {
    margin-top: 10px;
    color: var(--text-muted);
    font-weight: 700;
    font-size: 1rem;
  }
  .card {
    margin-top: 30px;
    background: var(--card);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: 34px 22px 30px;
  }
  .days-label { font-weight: 700; color: var(--text-muted); font-size: 1rem; }
  .days {
    font-size: clamp(4.2rem, 18vw, 6.5rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--text);
  }
  .days small { font-size: .35em; font-weight: 900; margin-left: .1em; }
  .units {
    margin-top: 18px;
    display: flex; justify-content: center; gap: 10px;
    flex-wrap: wrap;
  }
  .unit {
    min-width: 74px;
    background: #fff7f9;
    border: 2px solid #ffe3ec;
    border-radius: 16px;
    padding: 10px 6px 8px;
  }
  .unit.green { background: #f2fbf5; border-color: #d6f3e0; }
  .unit.gold { background: #fffaf0; border-color: #ffeec4; }
  .unit .num { font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .unit .lab { font-size: .78rem; font-weight: 700; color: var(--text-muted); }
  .bar-wrap { margin-top: 26px; text-align: left; }
  .bar-lab { font-size: .85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
  .bar {
    height: 16px; border-radius: 999px;
    background: #f3eef7; overflow: hidden;
  }
  .bar > div {
    height: 100%; width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--green));
    transition: width .6s ease;
  }
  .message {
    margin-top: 26px;
    font-size: 1.25rem; font-weight: 900;
    min-height: 1.6em;
  }
  .foot {
    margin-top: 34px;
    color: var(--text-muted);
    font-size: .85rem; font-weight: 700;
  }
  .foot a { color: var(--text-muted); }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="wrap">
  <div class="deco">🎄</div>
  <h1>クリスマスカウントダウン</h1>
  <p class="target" id="targetLine">----年--月25日（-）まで</p>

  <div class="card">
    <div class="days-label">クリスマスまで あと</div>
    <div class="days"><span id="d">--</span><small>日</small></div>
    <div class="units">
      <div class="unit"><div class="num" id="h">--</div><div class="lab">時間</div></div>
      <div class="unit green"><div class="num" id="m">--</div><div class="lab">分</div></div>
      <div class="unit gold"><div class="num" id="s">--</div><div class="lab">秒</div></div>
      <div class="unit"><div class="num" id="ms">---</div><div class="lab">ミリ秒</div></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-lab" id="barLab">12月の進み具合</div>
      <div class="bar"><div id="barFill"></div></div>
    </div>
    <div class="message" id="message"></div>
  </div>

</div>

<script>
  (function () {
    'use strict';
    var WEEK = ['日', '月', '火', '水', '木', '金', '土'];
    var el = {
      target: document.getElementById('targetLine'),
      d: document.getElementById('d'),
      h: document.getElementById('h'),
      m: document.getElementById('m'),
      s: document.getElementById('s'),
      ms: document.getElementById('ms'),
      barFill: document.getElementById('barFill'),
      barLab: document.getElementById('barLab'),
      msg: document.getElementById('message')
    };

    function xmasOf(year) { return new Date(year, 11, 25, 0, 0, 0, 0); }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function update() {
      var now = new Date();
      var year = now.getFullYear();
      var target = xmasOf(year);
      var isXmasDay = now.getFullYear() === year && now.getMonth() === 11 && now.getDate() === 25;

      if (now.getTime() >= xmasOf(year).getTime() + 24 * 60 * 60 * 1000) {
        target = xmasOf(year + 1);
      }
      el.target.textContent = target.getFullYear() + '年12月25日（' + WEEK[target.getDay()] + '）まで';

      var diff = target.getTime() - now.getTime();
      if (isXmasDay) {
        el.d.textContent = '0';
        el.h.textContent = '00';
        el.m.textContent = '00';
        el.s.textContent = '00';
        el.ms.textContent = '000';
        el.msg.textContent = '🎄 メリークリスマス！ 🎁';
      } else {
        var totalSec = Math.floor(diff / 1000);
        el.d.textContent = Math.floor(totalSec / 86400);
        el.h.textContent = pad(Math.floor(totalSec % 86400 / 3600));
        el.m.textContent = pad(Math.floor(totalSec % 3600 / 60));
        el.s.textContent = pad(totalSec % 60);
        var msPart = diff - totalSec * 1000;
        el.ms.textContent = ('00' + msPart).slice(-3);
        el.msg.textContent = '';
      }

      // 進捗バー: 12月1日 0:00 → 12月25日 0:00
      var start = new Date(target.getFullYear(), 11, 1, 0, 0, 0, 0).getTime();
      var p = (now.getTime() - start) / (target.getTime() - start) * 100;
      if (isXmasDay) p = 100;
      p = Math.max(0, Math.min(100, p));
      el.barFill.style.width = p.toFixed(1) + '%';
      el.barLab.textContent = '12月の進み具合 ' + p.toFixed(1) + '%';
    }

    update();
    setInterval(update, 31);

    // 雪
    var cv = document.getElementById('snow');
    var ctx = cv.getContext('2d');
    var flakes = [];
    function resize() {
      cv.width = window.innerWidth;
      cv.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    for (var i = 0; i < 70; i++) {
      flakes.push({
        x: Math.random(), y: Math.random(),
        r: 1 + Math.random() * 2.6,
        v: 0.0004 + Math.random() * 0.0011,
        sway: Math.random() * Math.PI * 2,
        sw: 0.002 + Math.random() * 0.01
      });
    }
    function tick() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = 'rgba(190, 200, 220, 0.75)';
      flakes.forEach(function (f) {
        f.y += f.v;
        f.sway += 0.01;
        if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
        var x = (f.x + Math.sin(f.sway) * f.sw) * cv.width;
        ctx.beginPath();
        ctx.arc(x, f.y * cv.height, f.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
</body>
</html>
